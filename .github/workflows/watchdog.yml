name: HOJA DE VIDA HABILITADA - Banco de Talentos

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # cada 15 min, evitando :00/:15/:30/:45 (GitHub los retrasa)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Simular que se habilito (para probar que llega el correo)"
        type: boolean
        default: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: PRUEBA de aviso
        if: ${{ inputs.prueba }}
        run: echo "::error::PRUEBA - asi llegara el aviso cuando se habilite la carga de hoja de vida" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install patchright
      # Chrome real (ya viene en ubuntu-latest) con pantalla virtual: pasa Cloudflare mejor que headless
      # Estado entre corridas (ultima vez que vio la pagina, huella del sitio)
      - uses: actions/cache/restore@v4
        with:
          path: ci-state
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: Revisar boton CARGA TU HOJA DE VIDA
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: xvfb-run -a python watchdog.py
      - uses: actions/cache/save@v4
        if: always() && !inputs.prueba
        with:
          path: ci-state
          key: estado-${{ github.run_id }}
      # Push al celular (app ntfy) cuando el job falla = página habilitada (o modo prueba)
      - name: Aviso al celular
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: HOJA DE VIDA HABILITADA" -H "Priority: urgent" -H "Tags: rotating_light" \
               -H "Click: https://bancodetalentos.com.co/" \
               -d "Banco de Talentos ya permite cargar la hoja de vida. Toca para entrar." \
               "https://ntfy.sh/$NTFY_TOPIC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura
          path: fallo.png
          if-no-files-found: ignore
